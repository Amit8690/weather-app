<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="weatherApp">

        <h2>Weather Card</h2>
        <div class="input">
            <form action=""><input type="text" id="location" placeholder="location">
            <button id="search">Enter</button></form> 
        </div>

        <hr>
    <div>  
        <span class="city">Agra</span>
        <p class="date">Friday, 21 August</p>
    </div>
     
        <img class="mainIcon" src="icons8-sunny-weather-48.png" alt="Sunny">
  
        <div id="temperature">
            <span>32</span><span>°C</span>
        </div>

                <p id="condition">Clear sky</p>
<div class="weather-details">   
        <div class="details">
                
                 <span id="humidity">65%</span>
                 <small>Humidity</small>
        </div>    

        
</div>
     
             <hr>
   
    </div>
    <script src="weatherapp.js"></script>
</body>
</html>
